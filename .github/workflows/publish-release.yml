name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.gitversion.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - name: Determine version
        id: gitversion
        shell: bash
        run: |
          set -euo pipefail
          version=$(dotnet gitversion /showvariable SemVer)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.rid }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            executable: Mediana.Sample
          - os: windows-2025
            rid: win-x64
            executable: Mediana.Sample.exe
          - os: macos-15
            rid: osx-arm64
            executable: Mediana.Sample
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
      RUNTIME_IDENTIFIER: ${{ matrix.rid }}
      NATIVE_EXECUTABLE: ${{ matrix.executable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Check license headers
        run: dotnet run --file UpdateLicense.cs -- . --check
      - run: dotnet restore Mediana.slnx
      - run: dotnet build Mediana.slnx -c Release --no-restore -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true
      - run: dotnet format Mediana.slnx --verify-no-changes --no-restore
      - run: dotnet test Mediana.slnx -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - run: dotnet run --project samples/Mediana.Sample -c Release --no-build --no-restore -- --self-test
      - run: dotnet run --project samples/Mediana.Sample -c Release --no-build --no-restore -- --probe-mp4 tests/Mediana.Tests/Data/Mp4/avc-aac.mp4
      - run: dotnet run --project samples/Mediana.Sample -c Release --no-build --no-restore -- --probe-mp4 tests/Mediana.Tests/Data/Mp4/avc-tail.mov
      - run: dotnet run --project samples/Mediana.Sample -c Release --no-build --no-restore -- --remux-mp4 tests/Mediana.Tests/Data/Mp4/avc-aac.mp4 artifacts/remux-managed.ts
      - run: dotnet run --project samples/Mediana.Sample -c Release --no-build --no-restore -- --plan-hls-mp4 tests/Mediana.Tests/Data/Mp4/avc-segments.mp4 0 2250
      - run: dotnet run --project samples/Mediana.Sample -c Release --no-build --no-restore -- --hls-mp4 tests/Mediana.Tests/Data/Mp4/avc-segments.mp4 artifacts/hls-managed 0 1 2250
      - run: dotnet run --project samples/Mediana.Sample -c Release --no-build --no-restore -- --preview tests/Mediana.Tests/Data/Mp4/avc-weighted.mp4 artifacts/preview-managed.png 0 250 100 100
      - run: dotnet run --project samples/Mediana.Sample -c Release --no-build --no-restore -- --preview tests/Mediana.Tests/Data/Mp4/avc-weighted-rotated.mp4 artifacts/preview-managed-rotated.png 0 0 100 100
      - run: dotnet publish samples/Mediana.Sample -c Release -r "$RUNTIME_IDENTIFIER" -m:1 -p:IlcSingleThreaded=true -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true -o artifacts/native
      - run: dotnet publish tests/Mediana.NativeTests -c Release -r "$RUNTIME_IDENTIFIER" -m:1 -p:IlcSingleThreaded=true -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true -o artifacts/native-tests
      - name: Run native executable
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            sample_executable=./artifacts/native/Mediana.Sample.exe
            native_tests_executable=./artifacts/native-tests/Mediana.NativeTests.exe
          else
            sample_executable=./artifacts/native/Mediana.Sample
            native_tests_executable=./artifacts/native-tests/Mediana.NativeTests
          fi
          "$sample_executable" --self-test
          "$sample_executable" --probe-mp4 tests/Mediana.Tests/Data/Mp4/avc-aac.mp4
          "$sample_executable" --probe-mp4 tests/Mediana.Tests/Data/Mp4/avc-tail.mov
          "$sample_executable" --remux-mp4 tests/Mediana.Tests/Data/Mp4/avc-aac.mp4 artifacts/remux-native.ts
          "$sample_executable" --plan-hls-mp4 tests/Mediana.Tests/Data/Mp4/avc-segments.mp4 0 2250
          "$sample_executable" --hls-mp4 tests/Mediana.Tests/Data/Mp4/avc-segments.mp4 artifacts/hls-native 0 1 2250
          "$sample_executable" --preview tests/Mediana.Tests/Data/Mp4/avc-weighted.mp4 artifacts/preview-native.png 0 250 100 100
          "$sample_executable" --preview tests/Mediana.Tests/Data/Mp4/avc-weighted-rotated.mp4 artifacts/preview-native-rotated.png 0 0 100 100
          "$sample_executable" --decode-audio tests/Mediana.Tests/Data/Wave/s16-stereo.wav artifacts/audio-native.pcm 0
          "$native_tests_executable"
      - name: Package native executable
        shell: pwsh
        run: |
          $packageName = "Mediana-$env:PACKAGE_VERSION-$env:RUNTIME_IDENTIFIER"
          $packageDirectory = "artifacts/native-package"
          $archiveDirectory = "artifacts/binaries"
          New-Item -ItemType Directory -Path $packageDirectory, $archiveDirectory -Force | Out-Null
          Copy-Item "artifacts/native/$env:NATIVE_EXECUTABLE", README.md, LICENSE -Destination $packageDirectory
          if ($env:RUNNER_OS -eq "Windows") {
            $archiveName = "$packageName.zip"
            Compress-Archive -Path "$packageDirectory/*" -DestinationPath "$archiveDirectory/$archiveName"
          } else {
            $archiveName = "$packageName.tar.gz"
            tar -czf "$archiveDirectory/$archiveName" -C $packageDirectory .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $hash = (Get-FileHash "$archiveDirectory/$archiveName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content "$archiveDirectory/$archiveName.sha256" -Encoding ascii
      - name: Upload native executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/binaries/*
          if-no-files-found: error
      - name: Pack
        if: matrix.rid == 'linux-x64'
        run: dotnet pack Mediana.slnx -c Release --no-build --no-restore -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true -o artifacts/packages
      - name: Test release notes generation
        if: matrix.rid == 'linux-x64'
        run: |
          python3 -m venv artifacts/release-tools
          artifacts/release-tools/bin/python -m pip install -r .github/scripts/requirements.txt
          artifacts/release-tools/bin/python -m black --check .github/scripts
          artifacts/release-tools/bin/python -m isort --check-only --profile black .github/scripts
          artifacts/release-tools/bin/python -m mypy --strict .github/scripts
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Generate release notes from commits
        if: matrix.rid == 'linux-x64'
        run: >-
          python3 .github/scripts/release_notes.py --repository "$GITHUB_REPOSITORY"
          --version "$PACKAGE_VERSION" --commit "$GITHUB_SHA"
          --packages artifacts/packages --output artifacts/release-notes.md
      - name: Upload release notes
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: artifacts/release-notes.md
          if-no-files-found: error
      - name: Upload packages
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-packages
          path: artifacts/packages/*nupkg
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.rid }}
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore

  publish:
    name: Publish to NuGet.org
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Sign in to NuGet.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish packages and symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push 'artifacts/packages/*.nupkg' --skip-duplicate
          --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

  publish-github:
    name: Publish to GitHub Packages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Publish packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: >-
          dotnet nuget push 'artifacts/packages/*.nupkg' --skip-duplicate --no-symbols
          --api-key "$GITHUB_TOKEN" --source "https://nuget.pkg.github.com/${PACKAGE_OWNER}/index.json"

  release:
    name: Create GitHub release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [version, publish, publish-github]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes
          path: artifacts
      - name: Download native executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-*
          merge-multiple: true
          path: artifacts/binaries
      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: v${{ needs.version.outputs.version }}
          commit: ${{ github.sha }}
          name: Mediana ${{ needs.version.outputs.version }}
          artifacts: artifacts/binaries/*
          artifactErrorsFailBuild: true
          bodyFile: artifacts/release-notes.md
          skipIfReleaseExists: true
