name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.gitversion.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - name: Determine version
        id: gitversion
        shell: bash
        run: |
          set -euo pipefail
          version=$(dotnet gitversion /showvariable MajorMinorPatch)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.rid }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            executable: Mediana.Cli
          - os: windows-2025
            rid: win-x64
            executable: Mediana.Cli.exe
          - os: macos-15
            rid: osx-arm64
            executable: Mediana.Cli
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
      RUNTIME_IDENTIFIER: ${{ matrix.rid }}
      NATIVE_EXECUTABLE: ${{ matrix.executable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Check license headers
        run: dotnet run --file UpdateLicense.cs -- . --check
      - run: dotnet restore Mediana.slnx
      - run: dotnet build Mediana.slnx -c Release --no-restore -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true
      - run: dotnet format Mediana.slnx --verify-no-changes --no-restore
      - run: dotnet test Mediana.slnx -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - run: dotnet run --project samples/Mediana.Sample -c Release --no-build --no-restore -- --self-test
      - run: dotnet run --project tools/Mediana.Cli -c Release --no-build --no-restore -- -i tests/Mediana.Tests/Data/Mp3/stereo-cbr-id3v23.mp3 artifacts/audio-managed.wav
      - run: dotnet run --project tools/Mediana.Cli -c Release --no-build --no-restore -- -i tests/Mediana.Tests/Data/Pdf/report.pdf artifacts/page-managed.png
      - run: dotnet run --project tools/Mediana.Cli -c Release --no-build --no-restore -- probe mp4 tests/Mediana.Tests/Data/Mp4/avc-aac.mp4
      - run: dotnet run --project tools/Mediana.Cli -c Release --no-build --no-restore -- probe mp4 tests/Mediana.Tests/Data/Mp4/avc-tail.mov
      - run: dotnet run --project tools/Mediana.Cli -c Release --no-build --no-restore -- remux tests/Mediana.Tests/Data/Mp4/avc-aac.mp4 artifacts/remux-managed.ts
      - run: dotnet run --project tools/Mediana.Cli -c Release --no-build --no-restore -- hls plan tests/Mediana.Tests/Data/Mp4/avc-segments.mp4 --video-stream 0 --segment-ms 2250
      - run: dotnet run --project tools/Mediana.Cli -c Release --no-build --no-restore -- hls create tests/Mediana.Tests/Data/Mp4/avc-segments.mp4 artifacts/hls-managed --video-stream 0 --audio-stream 1 --segment-ms 2250
      - run: dotnet run --project tools/Mediana.Cli -c Release --no-build --no-restore -- video preview tests/Mediana.Tests/Data/Mp4/avc-weighted.mp4 artifacts/preview-managed.png --stream 0 --time-ms 250 --width 100 --height 100
      - run: dotnet run --project tools/Mediana.Cli -c Release --no-build --no-restore -- video preview tests/Mediana.Tests/Data/Mp4/avc-weighted-rotated.mp4 artifacts/preview-managed-rotated.png --stream 0 --time-ms 0 --width 100 --height 100
      - run: dotnet publish tools/Mediana.Cli -c Release -r "$RUNTIME_IDENTIFIER" -m:1 -p:IlcSingleThreaded=true -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true -o artifacts/native
      - run: dotnet publish tests/Mediana.NativeTests -c Release -r "$RUNTIME_IDENTIFIER" -m:1 -p:IlcSingleThreaded=true -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true -o artifacts/native-tests
      - name: Run native executable
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cli_executable=./artifacts/native/Mediana.Cli.exe
            native_tests_executable=./artifacts/native-tests/Mediana.NativeTests.exe
          else
            cli_executable=./artifacts/native/Mediana.Cli
            native_tests_executable=./artifacts/native-tests/Mediana.NativeTests
          fi
          "$cli_executable" --help
          "$cli_executable" -i tests/Mediana.Tests/Data/Mp3/stereo-cbr-id3v23.mp3 artifacts/audio-native.wav
          "$cli_executable" -i tests/Mediana.Tests/Data/Heif/basic-8bit.heic artifacts/heic-native.png
          "$cli_executable" -i tests/Mediana.Tests/Data/Pdf/report.pdf artifacts/page-native.png
          "$cli_executable" probe mp4 tests/Mediana.Tests/Data/Mp4/avc-aac.mp4
          "$cli_executable" probe mp4 tests/Mediana.Tests/Data/Mp4/avc-tail.mov
          "$cli_executable" remux tests/Mediana.Tests/Data/Mp4/avc-aac.mp4 artifacts/remux-native.ts
          "$cli_executable" hls plan tests/Mediana.Tests/Data/Mp4/avc-segments.mp4 --video-stream 0 --segment-ms 2250
          "$cli_executable" hls create tests/Mediana.Tests/Data/Mp4/avc-segments.mp4 artifacts/hls-native --video-stream 0 --audio-stream 1 --segment-ms 2250
          "$cli_executable" video preview tests/Mediana.Tests/Data/Mp4/avc-weighted.mp4 artifacts/preview-native.png --stream 0 --time-ms 250 --width 100 --height 100
          "$cli_executable" video preview tests/Mediana.Tests/Data/Mp4/avc-weighted-rotated.mp4 artifacts/preview-native-rotated.png --stream 0 --time-ms 0 --width 100 --height 100
          "$cli_executable" audio decode tests/Mediana.Tests/Data/Wave/s16-stereo.wav artifacts/audio-native.pcm --stream 0
          "$native_tests_executable"
      - name: Prepare native downloads
        shell: pwsh
        run: |
          $packageName = "Mediana-$env:PACKAGE_VERSION-$env:RUNTIME_IDENTIFIER"
          $packageDirectory = "artifacts/native-package"
          $releaseDirectory = "artifacts/binaries"
          New-Item -ItemType Directory -Path $packageDirectory, $releaseDirectory -Force | Out-Null
          $binaryName = if ($env:RUNNER_OS -eq "Windows") { "$packageName.exe" } else { $packageName }
          Copy-Item "artifacts/native/$env:NATIVE_EXECUTABLE" -Destination "$releaseDirectory/$binaryName"
          & "./$releaseDirectory/$binaryName" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $executableName = if ($env:RUNNER_OS -eq "Windows") { "mediana.exe" } else { "mediana" }
          Copy-Item "artifacts/native/$env:NATIVE_EXECUTABLE" -Destination "$packageDirectory/$executableName"
          Copy-Item README.md, LICENSE -Destination $packageDirectory
          if ($env:RUNNER_OS -eq "Windows") {
            $archiveName = "$packageName.zip"
            Compress-Archive -Path "$packageDirectory/*" -DestinationPath "$releaseDirectory/$archiveName"
          } else {
            $archiveName = "$packageName.tar.gz"
            tar -czf "$releaseDirectory/$archiveName" -C $packageDirectory .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($assetName in $binaryName, $archiveName) {
            $hash = (Get-FileHash "$releaseDirectory/$assetName" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $assetName" | Set-Content "$releaseDirectory/$assetName.sha256" -Encoding ascii
          }
      - name: Upload native executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/binaries/*
          if-no-files-found: error
      - name: Pack
        if: matrix.rid == 'linux-x64'
        run: dotnet pack Mediana.slnx -c Release --no-build --no-restore -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true -o artifacts/packages
      - name: Upload packages
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-packages
          path: artifacts/packages/*nupkg
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.rid }}
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore

  publish:
    name: Publish to NuGet.org
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Sign in to NuGet.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish packages and symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push 'artifacts/packages/*.nupkg' --skip-duplicate
          --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

  publish-github:
    name: Publish to GitHub Packages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Publish packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
        run: >-
          dotnet nuget push 'artifacts/packages/*.nupkg' --skip-duplicate --no-symbols
          --api-key "$GITHUB_TOKEN" --source "https://nuget.pkg.github.com/${PACKAGE_OWNER}/index.json"

  release:
    name: Create GitHub release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [version, publish, publish-github]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download native executables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-*
          merge-multiple: true
          path: artifacts/binaries
      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: v${{ needs.version.outputs.version }}
          commit: ${{ github.sha }}
          name: Mediana ${{ needs.version.outputs.version }}
          artifacts: artifacts/binaries/*
          artifactErrorsFailBuild: true
          body: ${{ github.event.head_commit.message }}
          skipIfReleaseExists: true
