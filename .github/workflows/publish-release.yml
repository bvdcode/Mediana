name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish packages and create a release
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.gitversion.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - name: Determine version
        id: gitversion
        shell: bash
        run: |
          set -euo pipefail
          version=$(dotnet gitversion /showvariable SemVer)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Mediana.slnx
      - run: dotnet build Mediana.slnx -c Release --no-restore -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true
      - run: dotnet format Mediana.slnx --verify-no-changes --no-restore
      - run: dotnet test Mediana.slnx -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - run: dotnet run --project samples/Mediana.Sample -c Release --no-build --no-restore -- --self-test
      - run: dotnet run --project samples/Mediana.Sample -c Release --no-build --no-restore -- --probe-mp4 tests/Mediana.Tests/Data/Mp4/avc-aac.mp4
      - run: dotnet run --project samples/Mediana.Sample -c Release --no-build --no-restore -- --probe-mp4 tests/Mediana.Tests/Data/Mp4/avc-tail.mov
      - run: dotnet run --project samples/Mediana.Sample -c Release --no-build --no-restore -- --preview tests/Mediana.Tests/Data/Mp4/avc-weighted.mp4 artifacts/preview-managed.png 0 250 100 100
      - run: dotnet publish samples/Mediana.Sample -c Release -m:1 -p:IlcSingleThreaded=true -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true -o artifacts/native
      - run: dotnet publish tests/Mediana.NativeTests -c Release -m:1 -p:IlcSingleThreaded=true -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true -o artifacts/native-tests
      - name: Run native executable
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            sample_executable=./artifacts/native/Mediana.Sample.exe
            native_tests_executable=./artifacts/native-tests/Mediana.NativeTests.exe
          else
            sample_executable=./artifacts/native/Mediana.Sample
            native_tests_executable=./artifacts/native-tests/Mediana.NativeTests
          fi
          "$sample_executable" --self-test
          "$sample_executable" --probe-mp4 tests/Mediana.Tests/Data/Mp4/avc-aac.mp4
          "$sample_executable" --probe-mp4 tests/Mediana.Tests/Data/Mp4/avc-tail.mov
          "$sample_executable" --preview tests/Mediana.Tests/Data/Mp4/avc-weighted.mp4 artifacts/preview-native.png 0 250 100 100
          "$native_tests_executable"
      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack Mediana.slnx -c Release --no-build --no-restore -p:Version="$PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true -o artifacts/packages
      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-packages
          path: artifacts/packages/*nupkg
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore

  publish:
    name: Publish to NuGet.org
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Sign in to NuGet.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish packages and symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push 'artifacts/packages/*.nupkg' --skip-duplicate
          --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

  release:
    name: Create GitHub release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: v${{ needs.version.outputs.version }}
          commit: ${{ github.sha }}
          name: Mediana ${{ needs.version.outputs.version }}
          artifacts: artifacts/packages/*.nupkg,artifacts/packages/*.snupkg
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          skipIfReleaseExists: true
