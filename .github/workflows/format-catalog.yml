name: Check format catalog

on:
  push:
    branches: [main, develop]
    paths:
      - docs/formats/**
      - tools/format-catalog.py
      - .github/workflows/format-catalog.yml
  pull_request:
    branches: [main, develop]
    paths:
      - docs/formats/**
      - tools/format-catalog.py
      - .github/workflows/format-catalog.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 tools/format-catalog.py --check
