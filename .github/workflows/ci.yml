name: Build and test

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Mediana.slnx
      - run: dotnet build Mediana.slnx -c Release --no-restore
      - run: dotnet format Mediana.slnx --verify-no-changes --no-restore
      - run: dotnet test Mediana.slnx -c Release --no-build --no-restore
      - run: dotnet run --project samples/Mediana.Sample -c Release --no-build -- --self-test
      - run: dotnet publish samples/Mediana.Sample -c Release -o artifacts/native
      - name: Run native executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./artifacts/native/Mediana.Sample.exe --self-test
          else
            ./artifacts/native/Mediana.Sample --self-test
          fi
      - run: dotnet pack Mediana.slnx -c Release --no-build --no-restore -o artifacts/packages
